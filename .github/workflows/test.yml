name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Target ID (empty runs every target)
        required: false
        type: string
      shard:
        description: Shard Name (empty runs every shard)
        required: false
        type: string
      tests:
        description: LLDB API path overriding the selected shard
        required: false
        type: string
      llvm_revision:
        description: LLVM revision (default main or the reused artifact revision)
        required: false
        type: string
      lldb_run:
        description: Prior workflow run containing LLDB artifacts
        required: false
        type: string
      trace:
        description: Enable DSX trace logging
        default: false
        required: false
        type: boolean
      timeout:
        description: Per-module deadline in seconds (0 disables the deadline)
        default: '600'
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

env:
  LLVM_CAS_LIMIT: 4294967296
  LLVM_VERSION: main
  PYTHON_VERSION: '3.11'
  SWIFT_CAS_LIMIT: 536870912

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      compatibility: ${{ steps.versions.outputs.compatibility }}
      hosts: ${{ steps.versions.outputs.hosts }}
      python: ${{ steps.versions.outputs.python }}
      llvm: ${{ steps.llvm.outputs.revision }}
      shards: ${{ steps.versions.outputs.shards }}
      swift: ${{ steps.versions.outputs.swift }}
      targets: ${{ steps.versions.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      - name: Test CI harness
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - id: versions
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
          TARGET: ${{ inputs.target }}
        run: |
          targets=$(jq -c --arg target "$TARGET" \
            '[.targets[] | select($target == "" or .id == $target)]' \
            .github/matrix.json)
          compatibility=$(jq -c --arg target "$TARGET" \
            '[.targets[] | select(.compatibility and ($target == "" or .id == $target))]' \
            .github/matrix.json)
          hosts=$(jq -c --arg target "$TARGET" \
            'if $target == "" then .hosts else
              ([.targets[] | select(.id == $target) | .lldb] | unique) as $ids |
              [.hosts[] | select(.id as $id | $ids | index($id))]
            end' .github/matrix.json)
          shards=$(jq -c --arg shard "$SHARD" \
            '[.shards[] | select($shard == "" or .name == $shard)]' \
            .github/matrix.json)
          test "$(jq length <<< "$targets")" -ne 0
          test "$(jq length <<< "$compatibility")" -ne 0
          test "$(jq length <<< "$hosts")" -ne 0
          test "$(jq length <<< "$shards")" -ne 0
          echo "compatibility=$compatibility" >> "$GITHUB_OUTPUT"
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "python=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "swift=$(jq -c .swift .github/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
      - id: llvm
        shell: bash
        env:
          REVISION: ${{ inputs.llvm_revision }}
        run: |
          revision="$REVISION"
          if [[ -z "$revision" ]]; then
            revision=$(git ls-remote --exit-code --refs \
              https://github.com/llvm/llvm-project.git \
              "refs/heads/$LLVM_VERSION" | awk '{ print $1 }')
          fi
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout LLDB patch inputs
        if: inputs.lldb_run == ''
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: ${{ steps.llvm.outputs.revision }}
          path: llvm-project
          fetch-depth: 1
          sparse-checkout: lldb

      - name: Validate LLDB test patches before building
        if: inputs.lldb_run == ''
        shell: pwsh
        run: |
          foreach ($patch in Get-ChildItem .github/patches/lldb-*.patch) {
            git -C llvm-project apply --reverse --check $patch.FullName 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C llvm-project apply $patch.FullName
              if ($LASTEXITCODE -ne 0) { throw "Unable to apply $($patch.Name)" }
            }
          }

  lldb:
    name: LLDB · ${{ matrix.host.name }} · ${{ matrix.swift.build }}
    needs: versions
    if: github.event_name != 'workflow_dispatch' || inputs.lldb_run == ''
    runs-on: ${{ matrix.host.runner }}
    strategy:
      fail-fast: false
      matrix:
        swift: ${{ fromJSON(needs.versions.outputs.swift) }}
        host: ${{ fromJSON(needs.versions.outputs.hosts) }}

    steps:
      - uses: actions/checkout@v7

      - name: Checkout LLVM
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: ${{ needs.versions.outputs.llvm }}
          path: llvm-project
          fetch-depth: 1
          sparse-checkout: |
            clang
            cmake
            libc
            libcxx
            libcxxabi
            lld
            lldb
            libunwind
            llvm
            runtimes
            third-party

      - name: Apply LLDB platform corrections
        shell: pwsh
        run: |
          foreach ($patch in Get-ChildItem .github/patches/llvm-*.patch) {
            git -C llvm-project apply --reverse --check $patch.FullName 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C llvm-project apply $patch.FullName
              if ($LASTEXITCODE -ne 0) { throw "Unable to apply $($patch.Name)" }
            }
          }

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Swift
        uses: ./.github/actions/setup-swift
        with:
          version: ${{ matrix.swift.version }}
          build: ${{ matrix.swift.build }}
          architecture: ${{ matrix.host.host }}

      - uses: ./.github/actions/setup-cmake

      - name: Configure LLDB CAS
        shell: pwsh
        run: |
          $tools = if ($IsMacOS) {
            $information = & swift -print-target-info | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $usr = [IO.Directory]::GetParent(
                [IO.Directory]::GetParent(
                    $information.paths.runtimeResourcePath)).FullName
            [IO.Path]::Combine($usr, "bin")
          } else {
            [IO.Path]::GetDirectoryName((Get-Command clang-cache).Source)
          }
          $names = if ($IsWindows) {
            "clang-cache.exe", "clang-cl.exe", "clang-cl.exe"
          } else {
            "clang-cache", "clang", "clang++"
          }
          $launcher = [IO.Path]::Combine($tools, $names[0])
          if (![IO.File]::Exists($launcher)) {
            throw "Unable to locate clang-cache"
          }
          $compiler = [IO.Path]::Combine($tools, $names[1])
          $compilerxx = [IO.Path]::Combine($tools, $names[2])
          if (![IO.File]::Exists($compiler) -or
              ![IO.File]::Exists($compilerxx)) {
            throw "Unable to locate the Clang compilers"
          }
          $path =
              [IO.Path]::Join("${{ github.workspace }}", ".build", "lldb-cas")
          $prefix = "clang-cas-lldb-${{ runner.os }}-${{ runner.arch }}-"
          $prefix += "${{ matrix.swift.build }}-"
          $map = "${{ github.workspace }}=/^workspace"
          $lines = @("CLANG_CACHE_LAUNCHER=$launcher",
                     "CLANG_COMPILER=$compiler",
                     "CLANGXX_COMPILER=$compilerxx",
                     "LLVM_CACHE_CAS_PATH=$path",
                     "LLVM_CACHE_PREFIX_MAPS=$map")
          if (!$IsWindows) {
            $session = "${{ github.run_id }}-${{ matrix.host.id }}"
            $lines += "LLVM_CACHE_BUILD_SESSION_ID=$session"
          }
          $key = "${prefix}${{ github.run_id }}-${{ github.run_attempt }}"
          $lines += "LLVM_CAS_PREFIX=$prefix", "LLVM_CAS_KEY=$key"
          $lines | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore LLDB CAS
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LLVM_CACHE_CAS_PATH }}
          key: ${{ env.LLVM_CAS_KEY }}
          restore-keys: ${{ env.LLVM_CAS_PREFIX }}

      - name: Install LLDB build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes --no-install-recommends
          libedit-dev liblzma-dev libncurses-dev libxml2-dev ninja-build swig

      - name: Install SWIG
        if: runner.os == 'macOS'
        shell: bash
        run: brew install swig

      - name: Checkout libxml2
        if: runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          repository: GNOME/libxml2
          ref: d23960a130c5bb82779c9405fbbf85e65fb3c57c # v2.14.6
          path: .build/libxml2-source
          persist-credentials: false

      - name: Build libxml2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -G Ninja -S .build/libxml2-source -B .build/libxml2 `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$env:CLANG_COMPILER" `
            "-DCMAKE_C_COMPILER_LAUNCHER=$env:CLANG_CACHE_LAUNCHER" `
            "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/.build/libxml2-install" `
            -DBUILD_SHARED_LIBS=ON `
            -DLIBXML2_WITH_ICONV=OFF `
            -DLIBXML2_WITH_PROGRAMS=OFF `
            -DLIBXML2_WITH_PYTHON=OFF `
            -DLIBXML2_WITH_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .build/libxml2 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install .build/libxml2 --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .build/llvm/bin | Out-Null
          Copy-Item .build/libxml2-install/bin/libxml2.dll .build/llvm/bin

      - name: Configure LLDB
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cmake -G Ninja -S llvm-project/llvm -B .build/llvm
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER="$CLANG_COMPILER"
          -DCMAKE_CXX_COMPILER="$CLANGXX_COMPILER"
          -DCMAKE_C_COMPILER_LAUNCHER:FILEPATH="$CLANG_CACHE_LAUNCHER"
          -DCMAKE_CXX_COMPILER_LAUNCHER:FILEPATH="$CLANG_CACHE_LAUNCHER"
          -DLLVM_APPEND_VC_REV=OFF
          -DLLVM_ENABLE_PROJECTS='clang;lld;lldb'
          -DLLVM_ENABLE_RUNTIMES='${{ runner.os == 'macOS' && 'libcxx;libcxxabi;libunwind' || '' }}'
          -DLLVM_TARGETS_TO_BUILD='AArch64;ARM;X86'
          -DLLVM_ENABLE_ASSERTIONS=OFF
          -DLLVM_INCLUDE_BENCHMARKS=OFF
          -DLLVM_INCLUDE_EXAMPLES=OFF
          -DLLVM_INCLUDE_TESTS=OFF
          -DLLDB_INCLUDE_TESTS=ON
          -DLLDB_ENABLE_LIBXML2=ON
          -DLLDB_ENABLE_LZMA=${{ runner.os == 'Linux' && 'ON' || 'AUTO' }}
          -DLLDB_ENABLE_PYTHON=ON
          -DLLDB_USE_SYSTEM_DEBUGSERVER=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}
          -DPython3_EXECUTABLE="$(command -v python)"

      - name: Configure LLDB
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $architecture = "${{ matrix.host.host }}"
          $triple = switch ($architecture) {
            "arm64" { "aarch64-pc-windows-msvc" }
            "amd64" { "x86_64-pc-windows-msvc" }
            default { throw "Unsupported Windows host architecture" }
          }
          $assembly = if ($architecture -eq "amd64") {
            $assembler = (Get-Command llvm-ml).Source
            "-DCMAKE_ASM_MASM_COMPILER=$assembler"
            "-DCMAKE_ASM_MASM_FLAGS=-m64"
          }
          cmake -G Ninja -S llvm-project/llvm -B .build/llvm `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$env:CLANG_COMPILER" `
            "-DCMAKE_CXX_COMPILER=$env:CLANGXX_COMPILER" `
            "-DCMAKE_C_COMPILER_LAUNCHER:FILEPATH=$env:CLANG_CACHE_LAUNCHER" `
            "-DCMAKE_CXX_COMPILER_LAUNCHER:FILEPATH=$env:CLANG_CACHE_LAUNCHER" `
            "-DCMAKE_INCLUDE_SYSTEM_FLAG_C:STRING=-imsvc " `
            "-DCMAKE_INCLUDE_SYSTEM_FLAG_CXX:STRING=-imsvc " `
            "-DLLVM_HOST_TRIPLE=$triple" `
            -DLLVM_APPEND_VC_REV=OFF `
            "-DLLVM_ENABLE_PROJECTS=clang;lld;lldb" `
            "-DLLVM_TARGETS_TO_BUILD=AArch64;ARM;X86" `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLDB_INCLUDE_TESTS=ON `
            -DLLDB_ENABLE_CURSES=OFF `
            -DLLDB_ENABLE_LIBEDIT=OFF `
            -DLLDB_ENABLE_LIBXML2=ON `
            "-DLIBXML2_INCLUDE_DIR=${{ github.workspace }}/.build/libxml2-install/include/libxml2" `
            "-DLIBXML2_LIBRARY=${{ github.workspace }}/.build/libxml2-install/lib/libxml2.lib" `
            -DLLDB_ENABLE_PYTHON=ON `
            "-DPython3_EXECUTABLE=$((Get-Command python).Source)" `
            @assembly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify LLDB compiler cache
        shell: pwsh
        run: |
          $cache = Get-Content .build/llvm/CMakeCache.txt
          $expectedlauncher =
              (Get-Item $env:CLANG_CACHE_LAUNCHER).FullName
          foreach ($language in "C", "CXX") {
            $name = "CMAKE_${language}_COMPILER_LAUNCHER:"
            $setting = @($cache | Where-Object { $_.StartsWith($name) })
            if ($setting.Count -ne 1) {
              throw "$name was not configured"
            }
            $launcher = (Get-Item $setting[0].Split("=", 2)[1]).FullName
            if ($launcher -ne $expectedlauncher) {
              throw "$name does not use $expectedlauncher"
            }
            $compilername = "CMAKE_${language}_COMPILER:"
            $compilersetting = @($cache |
                Where-Object { $_.StartsWith($compilername) })
            if ($compilersetting.Count -ne 1) {
              throw "$compilername was not configured"
            }
            $expectedcompiler = if ($language -eq "C") {
              (Get-Item $env:CLANG_COMPILER).FullName
            } else {
              (Get-Item $env:CLANGXX_COMPILER).FullName
            }
            $compiler =
                (Get-Item $compilersetting[0].Split("=", 2)[1]).FullName
            if ($compiler -ne $expectedcompiler) {
              throw "$compilername does not use $expectedcompiler"
            }
          }
          $executable = [IO.Path]::GetFileName($expectedlauncher)
          $configured = Select-String -Path .build/llvm/build.ninja `
              -Pattern $executable -SimpleMatch -Quiet
          if (!$configured) {
            throw "Ninja does not use $expectedlauncher"
          }

      - name: Build LLDB shared library
        if: runner.os == 'Windows'
        run: cmake --build .build/llvm --config Release --target liblldb

      - name: Build LLDB and test utilities
        run: >-
          cmake --build .build/llvm --config Release --parallel
          --target lldb-api-test-deps

      # Keep completed compilations even when a later compile or link fails.
      - name: Prune LLDB CAS
        if: >-
          !cancelled() && env.LLVM_CAS_KEY != '' &&
          github.ref == format('refs/heads/{0}',
                               github.event.repository.default_branch)
        shell: pwsh
        run: |
          $script = [IO.Path]::Join("${{ github.workspace }}", ".github",
              "scripts", "Prune-SwiftCAS.ps1")
          if (Test-Path -LiteralPath $env:LLVM_CACHE_CAS_PATH `
              -PathType Container) {
            & $script -Path $env:LLVM_CACHE_CAS_PATH `
                -SizeLimit ([int64]$env:LLVM_CAS_LIMIT)
          }

      - name: Save LLDB CAS
        if: >-
          !cancelled() && env.LLVM_CAS_KEY != '' &&
          github.ref == format('refs/heads/{0}',
                               github.event.repository.default_branch)
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LLVM_CACHE_CAS_PATH }}
          key: ${{ env.LLVM_CAS_KEY }}

      - name: Remove previous LLDB CAS
        if: >-
          !cancelled() && env.LLVM_CAS_KEY != '' &&
          github.ref == format('refs/heads/{0}',
                               github.event.repository.default_branch)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $caches = @(gh cache list --key $env:LLVM_CAS_PREFIX --limit 100 `
              --ref $env:GITHUB_REF --json id,key,createdAt |
              ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $saved = $caches | Where-Object key -EQ $env:LLVM_CAS_KEY
          if (!$saved) { exit 0 }
          foreach ($cache in ($caches | Where-Object {
              [datetime]$_.createdAt -lt [datetime]$saved.createdAt
          })) {
            gh cache delete $cache.id --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Archive LLDB
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar --exclude='*.a' --exclude='*.dSYM' -czf lldb.tar.gz \
            .build/llvm/bin .build/llvm/lib

      - name: Archive LLDB
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = ".artifacts/lldb/.build/llvm"
          New-Item -ItemType Directory -Force "$root/bin", "$root/lib" |
              Out-Null
          Copy-Item ".build/llvm/bin/*" "$root/bin" -Recurse
          Get-ChildItem ".build/llvm/lib" -Directory | Where-Object {
            $_.Name -match "python|site-packages"
          } | Copy-Item -Destination "$root/lib" -Recurse
          Compress-Archive -Path ".artifacts/lldb/.build" -DestinationPath lldb.zip

      - name: Record LLDB revision
        shell: pwsh
        run: Set-Content lldb-revision.txt "${{ needs.versions.outputs.llvm }}"

      - name: Upload LLDB
        uses: actions/upload-artifact@v7
        with:
          name: lldb-${{ matrix.host.id }}-${{ matrix.swift.build }}
          path: |
            lldb.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
            lldb-revision.txt
          if-no-files-found: error
          retention-days: 7

  spm:
    name: Compact SwiftPM compatibility
    needs: versions
    runs-on: windows-latest
    strategy:
      matrix:
        swift: ${{ fromJSON(needs.versions.outputs.swift) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-swift
        with:
          version: ${{ matrix.swift.version }}
          build: ${{ matrix.swift.build }}
          architecture: amd64
      - uses: ./.github/actions/build-spm
        id: build
        with:
          scratch-path: .build/spm-compact
      - name: Validate compact products
        shell: pwsh
        env:
          BIN: ${{ steps.build.outputs.bin }}
        run: |
          & "$env:BIN/dsx.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/smoke-dsx.py "$env:BIN/dsx.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "$env:BIN/DSX.dll", "$env:BIN/dsx.exe" |
              Select-Object Name, Length | Format-Table

  dsx:
    name: DSX · ${{ matrix.target.name }} · ${{ matrix.swift.build }}
    needs: versions
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        swift: ${{ fromJSON(needs.versions.outputs.swift) }}
        target: ${{ fromJSON(needs.versions.outputs.targets) }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Swift
        uses: ./.github/actions/setup-swift
        with:
          version: ${{ matrix.swift.version }}
          build: ${{ matrix.swift.build }}
          architecture: ${{ matrix.target.host }}
          android: ${{ matrix.target.sdk == 'android' }}
          target: ${{ matrix.target.triple }}

      - name: Configure Swift CAS
        # Swift 6.4 ARM64 asserts in clang/CAS/IncludeTree.h.
        if: matrix.target.id != 'windows-arm64'
        shell: pwsh
        run: |
          $path = [IO.Path]::Join("${{ github.workspace }}", ".build", "cas")
          $prefix = "cmake-cas-test-${{ matrix.target.id }}-"
          $prefix += "${{ matrix.swift.build }}-"
          if (!$IsWindows) {
            "SWIFT_CAS_PATH=$([IO.Path]::Join($path, 'swift'))" |
                Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          "LLVM_CACHE_CAS_PATH=$([IO.Path]::Join($path, 'clang'))" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SWIFT_CAS_PREFIX=$prefix" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SWIFT_CAS_KEY=${prefix}${{ github.run_id }}-${{ github.run_attempt }}" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore Swift CAS
        if: env.SWIFT_CAS_KEY != ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.SWIFT_CAS_PATH }}
            ${{ env.LLVM_CACHE_CAS_PATH }}
          key: ${{ env.SWIFT_CAS_KEY }}
          restore-keys: ${{ env.SWIFT_CAS_PREFIX }}

      - name: Build and test DSX
        id: build
        uses: ./.github/actions/build-dsx
        with:
          scratch-path: .build/test/${{ matrix.target.id }}
          configuration: debug
          sdk: ${{ matrix.target.sdk }}
          target: ${{ matrix.target.triple }}
          test: ${{ matrix.target.test }}

      - name: Package DSX
        if: runner.os != 'Windows' && matrix.target.sdk != 'android'
        shell: bash
        env:
          BIN: ${{ steps.build.outputs.bin }}
          TARGET_ID: ${{ matrix.target.id }}
        run: |
          set -euo pipefail
          mkdir -p ".artifacts/$TARGET_ID"
          cp "$BIN/dsx" ".artifacts/$TARGET_ID/"
          tar -czf ".artifacts/$TARGET_ID.tar.gz" -C .artifacts "$TARGET_ID"

      - name: Package DSX
        if: runner.os == 'Windows' && matrix.target.sdk != 'android'
        shell: pwsh
        env:
          BIN: ${{ steps.build.outputs.bin }}
          TARGET_ID: ${{ matrix.target.id }}
        run: |
          $output = ".artifacts/$env:TARGET_ID"
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item "$env:BIN/dsx.exe" $output
          if ($env:TARGET_ID -eq "windows-x86") {
            $sdk = Get-Item -LiteralPath $env:SDKROOT.TrimEnd('\', '/')
            $version = $sdk.Parent.Parent.Parent.Parent
            $redist = [IO.Path]::Join($version.Parent.Parent.FullName,
                "Redistributables", $version.Name)
            $modules = @(Get-ChildItem $redist -Filter "*.msm" | Where-Object {
              $_.Name -match '^rtl\.(dynamic\.)?(shared|private)\.x86\.msm$'
            } | Sort-Object Name)
            if (!$modules.Count) { throw "Missing Swift x86 redistributable" }
            & .github/scripts/Copy-SwiftRuntime.ps1 `
                -Module $modules[0].FullName -Executable "$output/dsx.exe" `
                -Scratch "$env:RUNNER_TEMP/dsx-x86-runtime"
          }
          & "$output/dsx.exe" version
          if ($LASTEXITCODE -ne 0) {
            throw "DSX version failed with exit code $LASTEXITCODE"
          }
          & "$output/dsx.exe" platform --help
          if ($LASTEXITCODE -ne 0) {
            throw "DSX platform --help failed with exit code $LASTEXITCODE"
          }
          python .github/scripts/smoke-dsx.py "$output/dsx.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $output -DestinationPath ".artifacts/$env:TARGET_ID.zip"

      - name: Package DSX
        if: matrix.target.sdk == 'android'
        shell: pwsh
        env:
          BIN: ${{ steps.build.outputs.bin }}
          TARGET_ID: ${{ matrix.target.id }}
        run: |
          $output = ".artifacts/$env:TARGET_ID"
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item "$env:BIN/dsx" $output
          tar -czf ".artifacts/$env:TARGET_ID.tar.gz" -C .artifacts `
              $env:TARGET_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Failed tests must not discard successful compilation work.
      - name: Prune Swift CAS
        if: >-
          !cancelled() && env.SWIFT_CAS_KEY != '' &&
          steps.build.outputs.compiled == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: pwsh
        run: |
          $script = [IO.Path]::Join("${{ github.workspace }}", ".github", "scripts", "Prune-SwiftCAS.ps1")
          foreach ($path in @($env:LLVM_CACHE_CAS_PATH, $env:SWIFT_CAS_PATH)) {
            if ($path -and (Test-Path -LiteralPath $path -PathType Container)) {
              & $script -Path $path -SizeLimit ([int64]$env:SWIFT_CAS_LIMIT)
            }
          }

      - name: Save Swift CAS
        if: >-
          !cancelled() && env.SWIFT_CAS_KEY != '' &&
          steps.build.outputs.compiled == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.SWIFT_CAS_PATH }}
            ${{ env.LLVM_CACHE_CAS_PATH }}
          key: ${{ env.SWIFT_CAS_KEY }}

      - name: Remove previous Swift CAS
        if: >-
          !cancelled() && env.SWIFT_CAS_KEY != '' &&
          steps.build.outputs.compiled == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $caches = @(gh cache list --key $env:SWIFT_CAS_PREFIX --limit 100 `
              --ref $env:GITHUB_REF --json id,key,createdAt |
              ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $saved = $caches | Where-Object key -EQ $env:SWIFT_CAS_KEY
          if (!$saved) { exit 0 }
          foreach ($cache in ($caches | Where-Object {
              [datetime]$_.createdAt -lt [datetime]$saved.createdAt
          })) {
            gh cache delete $cache.id --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload DSX
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ matrix.target.id }}-${{ matrix.swift.build }}
          path: >-
            .artifacts/*.${{ runner.os == 'Windows' && matrix.target.sdk !=
            'android' && 'zip' || 'tar.gz' }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  compatibility:
    name: ${{ matrix.target.name }} · ${{ matrix.swift.build }}
    needs: [versions, lldb, dsx]
    if: >-
      ${{ always() && !cancelled() && needs.versions.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        swift: ${{ fromJSON(needs.versions.outputs.swift) }}
        target: ${{ fromJSON(needs.versions.outputs.compatibility) }}
    uses: ./.github/workflows/lldb-target.yml
    with:
      target: ${{ toJSON(matrix.target) }}
      swift: ${{ toJSON(matrix.swift) }}
      shards: ${{ needs.versions.outputs.shards }}
      python: ${{ needs.versions.outputs.python }}
      llvm: ${{ needs.versions.outputs.llvm }}
      llvm_revision: ${{ inputs.llvm_revision || '' }}
      lldb_run: ${{ inputs.lldb_run || '' }}
      tests: ${{ inputs.tests || '' }}
      fail_fast: false
      trace: ${{ inputs.trace || false }}
      timeout: ${{ inputs.timeout || '600' }}
